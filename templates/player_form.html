{% extends "base.html" %}

{% block title %}{{ group.name }}{% endblock %}
{% block brand %}{{ group.name }}{% endblock %}
{% block footer %}{{ group.name }}{% endblock %}

{% block content %}
<section class="section section--narrow">
  <p class="crumbs"><a href="{{ url_for('show_group', token=group.token) }}">{{ group.name }}</a></p>
  <div class="section__head">
    <h1>{{ player.name }}</h1>
  </div>
  <form class="form" method="post" action="{{ url_for('edit_player', token=group.token, player_id=player.id) }}">
    <div class="field">
      <label for="name">Navn</label>
      <input class="input" id="name" name="name" value="{{ name }}" autocomplete="off">
    </div>
    <div class="field">
      <label for="handicap">Handicap</label>
      <input class="input" id="handicap" name="handicap" type="number" step="0.1" inputmode="decimal" value="{{ handicap_value }}">
      {% if error %}
      <p class="field__error">{{ error }}</p>
      {% endif %}
    </div>
    <div class="form__actions">
      <button class="btn btn--primary" type="submit">Lagre</button>
    </div>
  </form>
  <form method="post" action="{{ url_for('delete_player', token=group.token, player_id=player.id) }}">
    <button class="btn btn--danger" type="submit">Slett</button>
  </form>
</section>
{% endblock %}
