{% extends "base.html" %}

{% block title %}Registrer bane{% endblock %}
{% block brand %}Baner{% endblock %}
{% block content %}
<section class="section">
  <p class="crumbs"><a href="{{ url_for('list_golf_courses') }}">Baner</a></p>
  <div class="section__head">
    <h1>Registrer bane</h1>
  </div>

  {% if error %}
  <div class="flash-stack flash-stack--inline">
    <p class="flash flash--error">{{ error }}</p>
  </div>
  {% endif %}

  <form class="form" method="post" id="course-form" data-fetch-url="{{ url_for('fetch_course_data') }}">
    {% include "course_fields.html" %}
    <div class="form__actions">
      <button class="btn btn--primary" type="submit">Lagre bane</button>
      <a class="btn btn--ghost" href="{{ url_for('list_golf_courses') }}">Tilbake</a>
    </div>
  </form>
</section>
<script src="{{ url_for('static', filename='course_fetch.js') }}"></script>
{% endblock %}
