<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fore{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='owen.css') }}">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="{{ url_for('home') }}">{% block brand %}Fore{% endblock %}</a>
      </div>
    </header>
    <main class="site-main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer"><p>{% block footer %}Golf - et Owen Labs produkt{% endblock %}</p></footer>
  </div>
</body>
</html>
