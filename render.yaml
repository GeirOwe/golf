services:
  - type: web
    name: golf-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
      # Leave the Neon connection string that is already set in the Render dashboard.
      # A blueprint sync must not replace it with a Render Postgres URL.
      - key: DATABASE_URL
        sync: false
      # Set both in the Render dashboard. A blueprint sync must not clear them.
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ORGANIZER_SECRET
        sync: false
